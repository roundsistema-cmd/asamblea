<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Asamblea Digital — Votación de Propiedad Horizontal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --navy-950:#0b1524;
  --navy-900:#0f1e33;
  --navy-800:#152841;
  --navy-700:#1c3352;
  --navy-600:#274469;
  --gold:#c9a24b;
  --gold-soft:#e4c778;
  --sage:#5fa895;
  --sage-soft:#8fc9ba;
  --coral:#c9634b;
  --paper:#f3ede1;
  --ink:#e9e3d4;
  --ink-dim:#9fb0c6;
  --line:rgba(233,227,212,0.12);
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(201,162,75,0.10), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(95,168,149,0.10), transparent 60%),
    var(--navy-950);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  min-height:100vh;
}
h1,h2,h3,.display{font-family:'Fraunces',serif;letter-spacing:-0.01em;}
.mono{font-family:'IBM Plex Mono',monospace;}
::selection{background:var(--gold);color:var(--navy-950);}
button{font-family:inherit;cursor:pointer;}
a{color:var(--gold-soft);}
input,select{
  font-family:'IBM Plex Mono',monospace;
  background:var(--navy-800);
  border:1px solid var(--line);
  color:var(--ink);
  border-radius:8px;
  padding:11px 12px;
  font-size:14px;
  width:100%;
  outline:none;
  transition:border-color .15s;
}
input:focus,select:focus{border-color:var(--gold);}
label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-dim);display:block;margin-bottom:6px;}
.field{margin-bottom:16px;}

/* ---------- shell ---------- */
#app{min-height:100vh;display:flex;flex-direction:column;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 28px;border-bottom:1px solid var(--line);
  background:rgba(11,21,36,0.6);backdrop-filter:blur(6px);
  position:sticky;top:0;z-index:40;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand .mark{
  width:34px;height:34px;border-radius:9px;
  background:conic-gradient(from 220deg, var(--gold), var(--sage), var(--gold));
  display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces',serif;font-weight:700;color:var(--navy-950);font-size:16px;
}
.brand span{font-size:18px;font-weight:600;}
.pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 11px;border-radius:100px;font-size:12px;
  background:var(--navy-800);border:1px solid var(--line);color:var(--ink-dim);
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-dim);}
.dot.on{background:var(--sage-soft);box-shadow:0 0 8px var(--sage-soft);}
.dot.off{background:var(--coral);}
.btn{
  border:none;border-radius:9px;padding:11px 18px;font-weight:600;font-size:14px;
  background:var(--gold);color:var(--navy-950);transition:transform .1s, filter .15s;
}
.btn:hover{filter:brightness(1.08);}
.btn:active{transform:scale(.98);}
.btn.secondary{background:var(--navy-700);color:var(--ink);border:1px solid var(--line);}
.btn.danger{background:var(--coral);color:#221410;}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink-dim);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn.block{width:100%;}

/* ---------- centered auth ---------- */
.center-screen{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;}
.card{
  background:linear-gradient(180deg, rgba(21,40,65,0.9), rgba(15,30,51,0.9));
  border:1px solid var(--line);border-radius:var(--radius);
  padding:32px;width:100%;max-width:420px;
  box-shadow:0 30px 60px -30px rgba(0,0,0,0.6);
}
.card h1{font-size:26px;margin:0 0 4px;}
.card .sub{color:var(--ink-dim);font-size:14px;margin-bottom:26px;}
.err{color:var(--coral);font-size:13px;margin-top:10px;min-height:16px;}
.tabs-mini{display:flex;gap:6px;margin-bottom:22px;background:var(--navy-950);padding:4px;border-radius:9px;}
.tabs-mini button{flex:1;background:transparent;border:none;color:var(--ink-dim);padding:9px;border-radius:7px;font-size:13px;font-weight:600;}
.tabs-mini button.active{background:var(--navy-700);color:var(--ink);}

/* ---------- layout with sidebar (admin) ---------- */
.layout{display:flex;flex:1;min-height:0;}
.sidebar{
  width:220px;border-right:1px solid var(--line);
  padding:20px 12px;display:flex;flex-direction:column;gap:4px;
  background:rgba(11,21,36,0.4);
}
.sidebar button{
  text-align:left;background:transparent;border:none;color:var(--ink-dim);
  padding:11px 14px;border-radius:9px;font-size:14px;font-weight:500;
}
.sidebar button.active{background:var(--navy-700);color:var(--ink);}
.sidebar button:hover{color:var(--ink);}
.main{flex:1;padding:28px 32px;overflow-y:auto;}
.section-title{display:flex;align-items:baseline;gap:12px;margin-bottom:22px;}
.section-title h2{font-size:24px;margin:0;}
.section-title .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);}

/* ---------- grid / stat cards ---------- */
.grid{display:grid;gap:16px;}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:900px){.grid.cols-3,.grid.cols-2{grid-template-columns:1fr;} .layout{flex-direction:column;} .sidebar{width:100%;flex-direction:row;overflow-x:auto;}}
.stat{
  background:var(--navy-800);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;
}
.stat .num{font-family:'Fraunces',serif;font-size:34px;font-weight:600;color:var(--gold-soft);}
.stat .lbl{font-size:12px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;}

/* ---------- quorum gauge (signature element) ---------- */
.quorum-wrap{
  background:radial-gradient(120% 120% at 15% 0%, rgba(201,162,75,0.10), transparent 55%), var(--navy-800);
  border:1px solid var(--line);border-radius:var(--radius);
  padding:26px;display:flex;align-items:center;gap:26px;
}
.gauge{position:relative;width:130px;height:130px;flex-shrink:0;}
.gauge svg{transform:rotate(-90deg);}
.gauge .bg{fill:none;stroke:var(--navy-700);stroke-width:10;}
.gauge .fg{fill:none;stroke:var(--gold);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .5s ease;}
.gauge .pct{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:'Fraunces',serif;font-size:26px;font-weight:600;
}
.gauge .pct small{font-family:'Inter',sans-serif;font-size:10px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.08em;margin-top:2px;}

/* ---------- table ---------- */
table{width:100%;border-collapse:collapse;font-size:14px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-dim);padding:9px 12px;border-bottom:1px solid var(--line);}
td{padding:10px 12px;border-bottom:1px solid var(--line);}
tr:last-child td{border-bottom:none;}
.table-wrap{background:var(--navy-800);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.badge{display:inline-block;padding:3px 9px;border-radius:100px;font-size:11px;font-weight:600;}
.badge.activa{background:rgba(95,168,149,0.18);color:var(--sage-soft);}
.badge.pendiente{background:rgba(201,162,75,0.18);color:var(--gold-soft);}
.badge.detenida{background:rgba(201,99,75,0.18);color:#e39a86;}

/* ---------- question builder ---------- */
.opt-row{display:flex;gap:8px;margin-bottom:8px;}
.opt-row input{flex:1;}
.opt-row button{background:var(--navy-700);border:1px solid var(--line);color:var(--ink-dim);border-radius:8px;padding:0 12px;}

/* ---------- vote options ---------- */
.vote-option{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px;border:1.5px solid var(--line);border-radius:11px;margin-bottom:10px;
  background:var(--navy-800);transition:border-color .15s, background .15s;
}
.vote-option button{
  background:var(--navy-700);border:1px solid var(--line);color:var(--ink);
  padding:9px 16px;border-radius:8px;font-weight:600;font-size:13px;
}
.vote-option button:hover{background:var(--gold);color:var(--navy-950);border-color:var(--gold);}
.vote-option.voted{border-color:var(--sage-soft);}
.bar-track{height:8px;background:var(--navy-700);border-radius:4px;overflow:hidden;margin-top:8px;}
.bar-fill{height:100%;background:linear-gradient(90deg, var(--sage), var(--gold));border-radius:4px;transition:width .5s;}

.result-card{background:var(--navy-800);border:1px solid var(--line);border-radius:var(--radius);padding:24px;}
.empty{
  border:1.5px dashed var(--line);border-radius:var(--radius);
  padding:40px 24px;text-align:center;color:var(--ink-dim);
}
.empty .display{color:var(--ink);font-size:20px;margin-bottom:6px;}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--navy-700);border:1px solid var(--gold);color:var(--ink);
  padding:12px 20px;border-radius:9px;font-size:14px;z-index:100;
  opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

.divider{height:1px;background:var(--line);margin:24px 0;}
.file-drop{
  border:1.5px dashed var(--line);border-radius:var(--radius);
  padding:28px;text-align:center;color:var(--ink-dim);cursor:pointer;
  transition:border-color .15s;
}
.file-drop:hover{border-color:var(--gold);}
.hint{font-size:12px;color:var(--ink-dim);margin-top:8px;line-height:1.5;}
.audio-orb{
  width:120px;height:120px;border-radius:50%;margin:0 auto 18px;
  background:radial-gradient(circle at 35% 30%, var(--gold-soft), var(--gold) 55%, var(--navy-800) 100%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 0 rgba(201,162,75,0.4);
  animation:none;
}
.audio-orb.live{animation:pulse 1.8s infinite;}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(201,162,75,0.45);}
  70%{box-shadow:0 0 0 28px rgba(201,162,75,0);}
  100%{box-shadow:0 0 0 0 rgba(201,162,75,0);}
}
.audio-orb svg{width:44px;height:44px;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   ESTADO GLOBAL
========================================================= */
const state = {
  supabase: null,
  supaUrl: localStorage.getItem('asamblea_url') || '',
  supaKey: localStorage.getItem('asamblea_key') || '',
  session: JSON.parse(sessionStorage.getItem('asamblea_session') || 'null'), // {email, apartamento, coeficiente, es_admin}
  screen: 'auth', // auth | participant | admin
  adminTab: 'conexion',
  presenceChannel: null,
  onlineUsers: {}, // email -> {apartamento, coeficiente}
  activeQuestion: null,
  questions: [],
  votesForActive: [],
  myVoteOptionForActive: null,
  videoBlocked: false,
  // webrtc
  pc: null,
  peers: {}, // admin: participantEmail -> RTCPeerConnection
  localStream: null,
  remoteAudioEl: null,
  micLive: false,
  listening: false,
  signalChannel: null,
};

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2600);
}

function saveSession(s){
  state.session = s;
  sessionStorage.setItem('asamblea_session', JSON.stringify(s));
}
function clearSession(){
  state.session = null;
  sessionStorage.removeItem('asamblea_session');
}

/* =========================================================
   SUPABASE INIT
========================================================= */
function initSupabase(){
  if(!state.supaUrl || !state.supaKey) return false;
  try{
    state.supabase = window.supabase.createClient(state.supaUrl, state.supaKey);
    return true;
  }catch(e){ console.error(e); return false; }
}
initSupabase();

/* =========================================================
   RENDER ROUTER
========================================================= */
function render(){
  const root = document.getElementById('app');
  if(!state.supaUrl || !state.supaKey || !state.supabase){
    root.innerHTML = renderConnectionSetup();
    bindConnectionSetup();
    return;
  }
  if(!state.session){
    root.innerHTML = renderAuth();
    bindAuth();
    return;
  }
  if(state.session.es_admin){
    root.innerHTML = renderAdminShell();
    bindAdminShell();
  }else{
    root.innerHTML = renderParticipant();
    bindParticipant();
    ensureParticipantRealtime();
    ensureListenAudioSetup();
  }
}

/* =========================================================
   PANTALLA: CONFIGURAR CONEXIÓN A SUPABASE
========================================================= */
function renderConnectionSetup(){
  return `
  <div class="center-screen">
    <div class="card">
      <h1 class="display">Conectar base de datos</h1>
      <div class="sub">Ingresa las credenciales de tu proyecto de Supabase para activar la asamblea.</div>
      <div class="field">
        <label>Project URL</label>
        <input id="in-url" placeholder="https://xxxxx.supabase.co" value="${state.supaUrl||''}"/>
      </div>
      <div class="field">
        <label>Anon / Public Key</label>
        <input id="in-key" placeholder="eyJhbGciOi..." value="${state.supaKey||''}"/>
      </div>
      <button class="btn block" id="btn-connect">Conectar</button>
      <div class="err" id="conn-err"></div>
      <div class="hint">Estos datos se encuentran en Supabase → Project Settings → API. Se guardan solo en este navegador. Recuerda ejecutar antes el script <span class="mono">schema.sql</span> en el SQL Editor de tu proyecto.</div>
    </div>
  </div>`;
}
function bindConnectionSetup(){
  document.getElementById('btn-connect').onclick = async ()=>{
    const url = document.getElementById('in-url').value.trim();
    const key = document.getElementById('in-key').value.trim();
    const err = document.getElementById('conn-err');
    err.textContent = '';
    if(!url || !key){ err.textContent = 'Completa ambos campos.'; return; }
    localStorage.setItem('asamblea_url', url);
    localStorage.setItem('asamblea_key', key);
    state.supaUrl = url; state.supaKey = key;
    if(!initSupabase()){ err.textContent='No se pudo crear el cliente. Verifica los datos.'; return; }
    // probar conexión
    const { error } = await state.supabase.from('properties').select('id').limit(1);
    if(error){ err.textContent = 'Conectado, pero no se encontró la tabla "properties". Ejecuta schema.sql. ('+error.message+')'; }
    render();
  };
}

/* =========================================================
   PANTALLA: LOGIN / REGISTRO
========================================================= */
function renderAuth(){
  return `
  <div class="center-screen">
    <div class="card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px;">
        <div class="brand"><div class="mark">A</div></div>
        <div>
          <div style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);">Copropiedad</div>
          <h1 class="display" style="font-size:22px;margin:0;">Asamblea Digital</h1>
        </div>
      </div>
      <div class="sub">Ingresa con el correo y el código de acceso entregados por la administración.</div>
      <div class="field">
        <label>Correo electrónico</label>
        <input id="in-email" type="email" placeholder="nombre@correo.com"/>
      </div>
      <div class="field">
        <label>Código de acceso</label>
        <input id="in-code" placeholder="Código generado por el admin"/>
      </div>
      <button class="btn block" id="btn-login">Ingresar a la asamblea</button>
      <div class="err" id="auth-err"></div>
      <div class="divider"></div>
      <div class="hint">¿No tienes código? Solicítalo a la administración de la copropiedad. Tu correo y coeficiente deben estar previamente cargados en el sistema.</div>
      <button class="btn ghost block" style="margin-top:14px;" id="btn-change-conn">Cambiar conexión de base de datos</button>
    </div>
  </div>`;
}
function bindAuth(){
  document.getElementById('btn-change-conn').onclick = ()=>{
    localStorage.removeItem('asamblea_url'); localStorage.removeItem('asamblea_key');
    state.supaUrl=''; state.supaKey=''; state.supabase=null; render();
  };
  document.getElementById('btn-login').onclick = async ()=>{
    const email = document.getElementById('in-email').value.trim().toLowerCase();
    const code = document.getElementById('in-code').value.trim();
    const err = document.getElementById('auth-err');
    err.textContent='';
    if(!email || !code){ err.textContent='Completa correo y código.'; return; }
    // 1) Buscar por correo (insensible a mayúsculas) para poder distinguir el error
    const { data, error } = await state.supabase.from('properties').select('*').ilike('email', email).maybeSingle();
    if(error){
      err.textContent = 'Error de conexión: '+error.message+' (revisa que la tabla "properties" exista y que el anon key tenga permisos de lectura).';
      console.error(error);
      return;
    }
    if(!data){
      err.textContent = 'Ese correo no está registrado en la base de datos. Verifica que esté cargado en Carga de datos, con el mismo correo exacto.';
      return;
    }
    // 2) Comparar el código sin distinguir mayúsculas/espacios
    if(String(data.codigo).trim().toLowerCase() !== code.toLowerCase()){
      err.textContent = 'El código de acceso no coincide con el registrado para ese correo.';
      return;
    }
    saveSession({ email: data.email, apartamento: data.apartamento, coeficiente: Number(data.coeficiente), es_admin: !!data.es_admin });
    render();
  };
}

/* =========================================================
   PARTICIPANTE
========================================================= */
function renderParticipant(){
  const s = state.session;
  return `
  <div id="app-shell">
    <div class="topbar">
      <div class="brand"><div class="mark">A</div><span>Asamblea Digital</span></div>
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="pill mono">Apto ${s.apartamento} · Coef. ${s.coeficiente}</span>
        <span class="pill" id="listen-status"><span class="dot off"></span>Audio</span>
        <button class="btn ghost" id="btn-logout">Salir</button>
      </div>
    </div>
    <div class="main" style="max-width:640px;margin:0 auto;">
      <div class="section-title" style="justify-content:center;flex-direction:column;text-align:center;">
        <span class="eyebrow">En vivo</span>
        <h2>Transmisión del administrador</h2>
      </div>

      <div style="text-align:center;margin-bottom:28px;">
        <div class="audio-orb" id="audio-orb">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z" stroke="#0b1524" stroke-width="1.6"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3" stroke="#0b1524" stroke-width="1.6" stroke-linecap="round"/></svg>
        </div>
        <button class="btn" id="btn-listen">Escuchar audio de la asamblea</button>
        <div class="hint" id="video-hint" style="display:${state.videoBlocked?'block':'none'}">El administrador ha limitado la videoconferencia solo a audio.</div>
        <audio id="remote-audio" autoplay></audio>
      </div>

      <div id="question-zone"></div>
    </div>
  </div>`;
}

function bindParticipant(){
  document.getElementById('btn-logout').onclick = ()=>{ teardownWebRTC(); leavePresence(); clearSession(); render(); };
  document.getElementById('btn-listen').onclick = startListening;
  renderQuestionZone();
}

function renderQuestionZone(){
  const zone = document.getElementById('question-zone');
  if(!zone) return;
  const q = state.activeQuestion;
  if(!q){
    zone.innerHTML = `<div class="empty"><div class="display">Sin votación activa</div>Cuando el administrador publique una pregunta, aparecerá aquí.</div>`;
    return;
  }
  const opts = q.opciones;
  const stopped = q.estado === 'detenida';
  const myVote = state.myVoteOptionForActive;
  if(!stopped){
    zone.innerHTML = `
    <div class="result-card">
      <span class="badge ${q.estado}">${q.estado}</span>
      <h3 style="margin:10px 0 20px;font-size:20px;">${escapeHtml(q.texto)}</h3>
      ${opts.map(o=>`
        <div class="vote-option ${myVote===o?'voted':''}">
          <span>${escapeHtml(o)}${myVote===o?' · Tu voto':''}</span>
          ${myVote ? `<span class="hint">${myVote===o?'✓ Registrado':''}</span>` : `<button data-opt="${encodeURIComponent(o)}" class="btn-vote">Votar</button>`}
        </div>`).join('')}
      ${myVote ? '<div class="hint">Ya emitiste tu voto para esta pregunta. Los resultados se publicarán cuando el administrador cierre la votación.</div>' : ''}
    </div>`;
    zone.querySelectorAll('.btn-vote').forEach(b=>{
      b.onclick = ()=>castVote(decodeURIComponent(b.dataset.opt));
    });
  }else{
    const total = state.votesForActive.reduce((a,v)=>a+Number(v.coeficiente),0);
    const byOpt = {};
    opts.forEach(o=>byOpt[o]=0);
    state.votesForActive.forEach(v=>{ byOpt[v.opcion] = (byOpt[v.opcion]||0) + Number(v.coeficiente); });
    const quorum = q.umbral_quorum || total || 1;
    zone.innerHTML = `
    <div class="result-card">
      <span class="badge detenida">Votación cerrada</span>
      <h3 style="margin:10px 0 20px;font-size:20px;">${escapeHtml(q.texto)}</h3>
      ${opts.map(o=>{
        const pct = quorum>0 ? (byOpt[o]/quorum*100) : 0;
        return `<div style="margin-bottom:16px;">
          <div style="display:flex;justify-content:space-between;font-size:14px;"><span>${escapeHtml(o)}</span><span class="mono">${pct.toFixed(1)}%</span></div>

        </div>`;
      }).join('')}
      <div class="hint">Porcentaje calculado sobre el coeficiente total de copropietarios conectados durante la votación (${quorum.toFixed(2)}).</div>
    </div>`;
  }
}

  });

  state.myVoteOptionForActive = opcion;

/* Realtime del participante: settings, questions, votes */
function ensureParticipantRealtime(){
  if(state._participantRTBound) return;
  state._participantRTBound = true;
  joinPresence();
  loadSettingsAndActiveQuestion();

  state.supabase.channel('public:settings')
    .on('postgres_changes', {event:'*', schema:'public', table:'settings'}, payload=>{
      const row = payload.new;
      state.videoBlocked = row.video_bloqueado;
      const hint = document.getElementById('video-hint');
      if(hint) hint.style.display = state.videoBlocked ? 'block':'none';
      if(row.pregunta_activa !== (state.activeQuestion? state.activeQuestion.id : null)){
        loadSettingsAndActiveQuestion();
      }
    }).subscribe();

  state.supabase.channel('public:questions')
    .on('postgres_changes', {event:'*', schema:'public', table:'questions'}, payload=>{
      loadSettingsAndActiveQuestion();
    }).subscribe();

  state.supabase.channel('public:votes')
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'votes'}, payload=>{
      if(state.activeQuestion && payload.new.question_id === state.activeQuestion.id){
        state.votesForActive.push(payload.new);
        renderQuestionZone();
      }
    }).subscribe();
}

async function loadSettingsAndActiveQuestion(){
  const { data: settings } = await state.supabase.from('settings').select('*').eq('id',1).maybeSingle();
  if(settings) state.videoBlocked = settings.video_bloqueado;
  let qId = settings ? settings.pregunta_activa : null;
  if(!qId){
    // fallback: última pregunta activa o detenida más reciente
    const { data: qs } = await state.supabase.from('questions').select('*').order('creada_en',{ascending:false}).limit(1);
    state.activeQuestion = qs && qs.length ? qs[0] : null;
  }else{
    const { data: q } = await state.supabase.from('questions').select('*').eq('id',qId).maybeSingle();
    state.activeQuestion = q || null;
  }
  if(state.activeQuestion){
    const { data: votes } = await state.supabase.from('votes').select('*').eq('question_id', state.activeQuestion.id);
    state.votesForActive = votes || [];
    const mine = state.votesForActive.find(v=>v.email === state.session.email);
    state.myVoteOptionForActive = mine ? mine.opcion : null;
  }else{
    state.votesForActive = []; state.myVoteOptionForActive = null;
  }
  renderQuestionZone();
}

/* Presence: contar usuarios en línea con su coeficiente */
function joinPresence(){
  const s = state.session;
  const ch = state.supabase.channel('presence-asamblea', { config: { presence: { key: s.email } } });
  ch.on('presence', {event:'sync'}, ()=>{});
  ch.subscribe(async (status)=>{
    if(status === 'SUBSCRIBED'){
      await ch.track({ apartamento: s.apartamento, coeficiente: s.coeficiente, email: s.email });
    }
  });
  state.presenceChannel = ch;
}
function leavePresence(){
  if(state.presenceChannel){ state.presenceChannel.unsubscribe(); state.presenceChannel = null; }
}

/* =========================================================
   AUDIO — WebRTC (admin habla, participantes solo escuchan)
   Señalización vía Supabase Realtime Broadcast
========================================================= */
function ensureListenAudioSetup(){
  if(state._signalBound) return;
  state._signalBound = true;
  const s = state.session;
  const ch = state.supabase.channel('audio-signal', { config: { broadcast: { self: false } } });
  ch.on('broadcast', {event:'offer'}, async ({payload})=>{
    if(payload.to !== s.email) return;
    await handleOfferAsParticipant(payload);
  });
  ch.on('broadcast', {event:'ice'}, async ({payload})=>{
    if(payload.to !== s.email) return;
    if(state.pc){ try{ await state.pc.addIceCandidate(payload.candidate); }catch(e){} }
  });
  state.signalChannel = ch;
  ch.subscribe();
}

async function startListening(){
  const btn = document.getElementById('btn-listen');
  btn.disabled = true; btn.textContent = 'Conectando...';
  state.listening = true;
  // avisar al admin que quiero escuchar
  state.signalChannel.send({ type:'broadcast', event:'join', payload: { email: state.session.email, apartamento: state.session.apartamento } });
  setTimeout(()=>{
    if(btn){ btn.disabled=false; btn.textContent='Escuchar audio de la asamblea'; }
  }, 4000);
}

async function handleOfferAsParticipant(payload){
  if(state.pc) { state.pc.close(); }
  const pc = new RTCPeerConnection({ iceServers:[{urls:'stun:stun.l.google.com:19302'}] });
  state.pc = pc;
  pc.ontrack = (ev)=>{
    const audioEl = document.getElementById('remote-audio');
    if(audioEl) audioEl.srcObject = ev.streams[0];
    const orb = document.getElementById('audio-orb');
    if(orb) orb.classList.add('live');
    const st = document.getElementById('listen-status');
    if(st) st.innerHTML = '<span class="dot on"></span>Audio en vivo';
  };
  pc.onicecandidate = (ev)=>{
    if(ev.candidate){
      state.signalChannel.send({ type:'broadcast', event:'ice', payload:{ to:'admin-bridge', from: state.session.email, candidate: ev.candidate } });
    }
  };
  await pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  state.signalChannel.send({ type:'broadcast', event:'answer', payload:{ to: 'admin-bridge', from: state.session.email, sdp: answer } });
}

function teardownWebRTC(){
  if(state.pc){ state.pc.close(); state.pc = null; }
  if(state.localStream){ state.localStream.getTracks().forEach(t=>t.stop()); state.localStream=null; }
  Object.values(state.peers).forEach(pc=>pc.close());
  state.peers = {};
}

let pendingExcelRows = [];
function bindTabCarga(){
  const dz = document.getElementById('drop-zone');
  const input = document.getElementById('file-excel');
  dz.onclick = ()=>input.click();
  input.onchange = (e)=>handleExcelFile(e.target.files[0]);
  dz.ondragover = (e)=>{e.preventDefault();};
  dz.ondrop = (e)=>{ e.preventDefault(); handleExcelFile(e.dataTransfer.files[0]); };

  document.getElementById('m-save').onclick = async ()=>{

      apartamento: document.getElementById('m-apto').value.trim(),
      email: document.getElementById('m-email').value.trim().toLowerCase(),

    };

    ['m-apto','m-email','m-codigo','m-coef'].forEach(id=>document.getElementById(id).value='');

function handleExcelFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    const wb = XLSX.read(e.target.result, {type:'binary'});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
    pendingExcelRows = rows.map(r=>({
      apartamento: String(r.apartamento ?? r.Apartamento ?? r.apto ?? '').trim(),
      email: String(r.email ?? r.Email ?? r.correo ?? '').trim().toLowerCase(),
      codigo: String(r.codigo ?? r.Codigo ?? r['código'] ?? '').trim(),
      coeficiente: parseFloat(r.coeficiente ?? r.Coeficiente ?? 0),
      es_admin: String(r.es_admin ?? r.admin ?? 'false').toLowerCase()==='true'
    })).filter(r=>r.email);
    renderExcelPreview();
  };
  reader.readAsBinaryString(file);
}
function renderExcelPreview(){
  const el = document.getElementById('excel-preview');
  if(!pendingExcelRows.length){ el.innerHTML=''; return; }
  el.innerHTML = `

    </div>
    <div class="hint">${pendingExcelRows.length} filas detectadas.</div>
    <button class="btn" style="margin-top:12px;" id="btn-import">Guardar en base de datos</button>

  document.getElementById('btn-import').onclick = async ()=>{
    const { error } = await state.supabase.from('properties').upsert(pendingExcelRows, { onConflict:'email' });
    if(error){ toast('Error al importar: '+error.message); return; }
    toast('Importación completada'); pendingExcelRows=[]; renderExcelPreview();
  };
}

async function loadAllQuestions(){

        <svg viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z" stroke="#0b1524" stroke-width="1.6"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3" stroke="#0b1524" stroke-width="1.6" stroke-linecap="round"/></svg>
      </div>
      <button class="btn block" id="btn-mic">${state.micLive?'Detener transmisión de audio':'Iniciar transmisión de audio'}</button>
      <div class="hint">Al iniciar, tu micrófono se transmite en vivo a todos los copropietarios conectados.</div>
    </div>
    <div class="card" style="max-width:none;">
      <h3 style="margin-top:0;">Videoconferencia</h3>
      <div class="hint" style="margin-bottom:14px;">Limita la videoconferencia externa dejando disponible únicamente el audio del administrador. Los copropietarios verán un aviso de que el video fue bloqueado.</div>
      <button class="btn ${state.videoBlocked?'danger':'secondary'} block" id="btn-toggle-video">${state.videoBlocked?'Restablecer video':'Bloquear video (solo audio)'}</button>
    </div>
  </div>
  <div class="divider"></div>
  <div class="stat" style="max-width:280px;"><div class="num">${Object.keys(state.peers).length}</div><div class="lbl">Oyentes conectados por audio</div></div>
  `;
}
function bindTabAudio(){
  document.getElementById('btn-mic').onclick = toggleAdminMic;
  document.getElementById('btn-toggle-video').onclick = toggleVideoBlock;
}
async function toggleVideoBlock(){
  state.videoBlocked = !state.videoBlocked;
  await state.supabase.from('settings').update({ video_bloqueado: state.videoBlocked, actualizado_en: new Date().toISOString() }).eq('id',1);
  toast(state.videoBlocked ? 'Video bloqueado para todos' : 'Video restablecido');
  renderAdminTab();
}
async function toggleAdminMic(){
  if(state.micLive){
    teardownWebRTC();
    state.micLive = false;
    toast('Transmisión detenida');
    renderAdminTab();
    return;
  }
  try{
    state.localStream = await navigator.mediaDevices.getUserMedia({ audio:true, video:false });
  }catch(e){
    toast('No se pudo acceder al micrófono: '+e.message);
    return;
  }
  state.micLive = true;
  toast('Transmisión de audio iniciada');
  renderAdminTab();
  // conectar con oyentes ya en presencia
  Object.keys(state.onlineUsers).forEach(email=>createOfferForParticipant(email));
}
async function createOfferForParticipant(email){
  if(!state.localStream) return;
  if(state.peers[email]) { state.peers[email].close(); }
  const pc = new RTCPeerConnection({ iceServers:[{urls:'stun:stun.l.google.com:19302'}] });
  state.peers[email] = pc;
  state.localStream.getTracks().forEach(t=>pc.addTrack(t, state.localStream));
  pc.onicecandidate = (ev)=>{
    if(ev.candidate){
      state.signalChannel.send({ type:'broadcast', event:'ice', payload:{ to: email, from:'admin', candidate: ev.candidate } });
    }
  };
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  state.signalChannel.send({ type:'broadcast', event:'offer', payload:{ to: email, from:'admin', sdp: offer } });
}

/* Realtime del admin */
function ensureAdminRealtime(){
  if(state._adminRTBound) return;
  state._adminRTBound = true;

  const presCh = state.supabase.channel('presence-asamblea', { config: { presence: { key: 'admin-observer' } } });
  presCh.on('presence', {event:'sync'}, ()=>{
    const s = presCh.presenceState();
    const users = {};
    Object.keys(s).forEach(key=>{
      if(key==='admin-observer') return;
      const p = s[key][0];
      users[key] = p;
    });
    state.onlineUsers = users;
    const pill = document.getElementById('admin-online-pill');
    if(pill) pill.innerHTML = `<span class="dot on"></span>${Object.keys(users).length} en línea`;
    if(state.adminTab==='usuarios') renderAdminTab();
    if(state.adminTab==='votacion') renderQuorumBox();
  });
  presCh.subscribe(async (status)=>{ if(status==='SUBSCRIBED') await presCh.track({role:'admin'}); });

  const sigCh = state.supabase.channel('audio-signal', { config: { broadcast: { self:false } } });
  sigCh.on('broadcast', {event:'join'}, ({payload})=>{
    if(state.micLive) createOfferForParticipant(payload.email);
  });
  sigCh.on('broadcast', {event:'answer'}, async ({payload})=>{
    const pc = state.peers[payload.from];
    if(pc){ await pc.setRemoteDescription(new RTCSessionDescription(payload.sdp)); }
  });
  sigCh.on('broadcast', {event:'ice'}, async ({payload})=>{
    if(payload.to !== 'admin-bridge') return;
    const pc = state.peers[payload.from];
    if(pc){ try{ await pc.addIceCandidate(payload.candidate); }catch(e){} }
  });
  sigCh.subscribe();
  state.signalChannel = sigCh;

  state.supabase.channel('public:questions-admin')
    .on('postgres_changes', {event:'*', schema:'public', table:'questions'}, ()=>loadAllQuestions())
    .subscribe();
  state.supabase.channel('public:votes-admin')
    .on('postgres_changes', {event:'*', schema:'public', table:'votes'}, ()=>loadAllQuestions())
    .subscribe();

  loadAllQuestions();
}

========================================================= */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

render();
</script>
